<body class="min-h-screen bg-paper font-sans text-ink antialiased">

      知隙需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。

  <!-- 登录/session 校验占位；认证成功后才渲染应用。 -->
  <div id="auth-root" class="auth-root">
    <div class="flex min-h-[100dvh] items-center justify-center px-6">
      <div class="flex items-center gap-3 text-ink/45">
        <span class="h-5 w-5 animate-spin rounded-full border-2 border-pine-900/20 border-t-pine-900"></span>

      </div>
    </div>
  </div>

  <div id="app" class="relative z-[1] min-h-screen">
    <aside id="sidebar" aria-label="主导航"></aside>
    <div class="lg:pl-[276px]">
      <header id="mobile-header" class="lg:hidden"></header>
      <main class="mx-auto w-full max-w-[1320px] px-4 pb-32 pt-4 sm:px-6 sm:pt-5 lg:px-10 lg:pb-14 lg:pt-10">

    </div>

  <div id="modal-root"></div>
  <div id="confirm-root"></div>
  <div id="toast-root" class="pointer-events-none fixed inset-x-0 top-[4.75rem] z-[110] flex flex-col items-center gap-2 px-4 lg:bottom-8 lg:left-auto lg:right-8 lg:top-auto lg:items-end" role="status" aria-live="polite" aria-atomic="false"></div>
