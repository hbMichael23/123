[package]
name = "zhixi"
version = "1.0.0"
description = "知隙 · 经济学考研云端错题本"
authors = ["Zhixi"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# Windows/Linux 上 deep link 会用新进程再启动一次应用；single-instance
# + deep-link feature 会把 URL 转发到已运行的窗口。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
